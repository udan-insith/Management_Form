<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>IRONLEDGER — Member &amp; Institute Records</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--ink: #0a0e12;
				--panel: #10161c;
				--panel-2: #171f27;
				--line: #232c36;
				--line-soft: #1b232c;
				--gold: #c9a24b;
				--gold-soft: #e4c97a;
				--teal: #3fa796;
				--azure: #5b8dbe;
				--rust: #d9634a;
				--text: #edeff2;
				--muted: #8b96a5;
				--muted-2: #5f6b7a;
				--font-display: "Bebas Neue", sans-serif;
				--font-body: "IBM Plex Sans", -apple-system, sans-serif;
				--font-mono: "IBM Plex Mono", monospace;
			}

			* {
				box-sizing: border-box;
			}
			html {
				scroll-behavior: smooth;
			}
			body {
				margin: 0;
				background:
					radial-gradient(
						1200px 500px at 15% -10%,
						rgba(201, 162, 75, 0.07),
						transparent 60%
					),
					var(--ink);
				color: var(--text);
				font-family: var(--font-body);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}

			a {
				color: inherit;
			}
			button {
				font-family: inherit;
			}

			::selection {
				background: rgba(201, 162, 75, 0.35);
			}

			:focus-visible {
				outline: 2px solid var(--gold-soft);
				outline-offset: 2px;
			}

			@media (prefers-reduced-motion: reduce) {
				* {
					animation-duration: 0.01ms !important;
					transition-duration: 0.01ms !important;
				}
			}
			/* TOP BAR */
			.topbar {
				position: sticky;
				top: 0;
				z-index: 50;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 24px;
				padding: 14px clamp(16px, 4vw, 40px);
				background: rgba(10, 14, 18, 0.92);
				backdrop-filter: blur(10px);
				border-bottom: 1px solid var(--line);
				background-image: repeating-linear-gradient(
					to right,
					var(--line-soft) 0 6px,
					transparent 6px 14px
				);
				background-position: bottom;
				background-size: 100% 1px;
				background-repeat: repeat-x;
			}
			.brand {
				display: flex;
				align-items: baseline;
				gap: 10px;
				white-space: nowrap;
			}
			.brand .mark {
				font-family: var(--font-display);
				font-size: 26px;
				letter-spacing: 1.5px;
				color: var(--gold-soft);
			}
			.brand .sub {
				font-size: 12px;
				color: var(--muted-2);
			}
			.navlinks {
				display: flex;
				align-items: center;
				gap: 4px;
				flex-wrap: wrap;
			}
			.navlinks button {
				background: transparent;
				border: none;
				cursor: pointer;
				color: var(--muted);
				font-size: 14px;
				font-weight: 500;
				padding: 10px 14px;
				border-bottom: 2px solid transparent;
				transition:
					color 0.15s ease,
					border-color 0.15s ease;
			}
			.navlinks button:hover {
				color: var(--text);
			}
			.navlinks button.active {
				color: var(--text);
			}
			.navlinks button[data-tab="dashboard"].active {
				border-color: var(--gold-soft);
			}
			.navlinks button[data-tab="attendance"].active {
				border-color: var(--teal);
			}
			.navlinks button[data-tab="registration"].active {
				border-color: var(--azure);
			}
			.navlinks button[data-tab="studentpay"].active {
				border-color: var(--gold-soft);
			}
			.navlinks button[data-tab="institutepay"].active {
				border-color: var(--rust);
			}

			.iobtns {
				display: flex;
				gap: 8px;
			}
			.iobtn {
				display: flex;
				align-items: center;
				gap: 6px;
				background: var(--panel-2);
				border: 1px solid var(--line);
				color: var(--muted);
				font-size: 12.5px;
				padding: 8px 12px;
				border-radius: 3px;
				cursor: pointer;
				transition:
					border-color 0.15s ease,
					color 0.15s ease;
			}
			.iobtn:hover {
				border-color: var(--gold);
				color: var(--text);
			}
			/* LAYOUT */
			main {
				max-width: 1180px;
				margin: 0 auto;
				padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 40px) 100px;
			}
			.page {
				display: none;
			}
			.page.active {
				display: block;
				animation: rise 0.35s ease both;
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.tab-flag {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 6px;
			}
			.tab-flag i {
				width: 10px;
				height: 22px;
				border-radius: 1px;
				display: inline-block;
			}
			.tab-flag span {
				font-size: 12.5px;
				color: var(--muted);
				font-weight: 500;
			}
			.page-title {
				font-family: var(--font-display);
				font-size: clamp(34px, 5vw, 52px);
				letter-spacing: 0.5px;
				margin: 0 0 4px;
				color: var(--text);
			}
			.page-lede {
				color: var(--muted);
				font-size: 15px;
				max-width: 62ch;
				margin: 0 0 32px;
			}
			/* DASHBOARD */
			.stat-row {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 1px;
				background: var(--line);
				border: 1px solid var(--line);
				margin-bottom: 40px;
			}
			.stat {
				background: var(--panel);
				padding: 22px 20px;
			}
			.stat .num {
				font-family: var(--font-display);
				font-size: 38px;
				color: var(--gold-soft);
				display: block;
				line-height: 1;
			}
			.stat .lbl {
				color: var(--muted);
				font-size: 13px;
				margin-top: 8px;
				display: block;
			}

			.nav-grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 14px;
			}
			.nav-card {
				position: relative;
				background: var(--panel);
				border: 1px solid var(--line);
				border-top: 3px solid var(--card-accent, var(--gold));
				padding: 22px 18px 20px;
				text-align: left;
				cursor: pointer;
				color: var(--text);
				transition:
					transform 0.15s ease,
					background 0.15s ease;
			}
			.nav-card:hover {
				background: var(--panel-2);
				transform: translateY(-2px);
			}
			.nav-card h3 {
				font-family: var(--font-display);
				font-size: 22px;
				letter-spacing: 0.3px;
				margin: 10px 0 6px;
				font-weight: 400;
			}
			.nav-card p {
				margin: 0;
				color: var(--muted);
				font-size: 13px;
			}
			.nav-card .go {
				position: absolute;
				top: 18px;
				right: 16px;
				color: var(--muted-2);
				font-size: 18px;
			}
			/* FORMS */
			.sheet {
				background: var(--panel);
				border: 1px solid var(--line);
				padding: clamp(18px, 3vw, 30px);
				margin-bottom: 34px;
			}
			.sheet h2 {
				font-family: var(--font-display);
				font-weight: 400;
				font-size: 20px;
				letter-spacing: 0.3px;
				margin: 0 0 18px;
				color: var(--text);
			}
			.field-grid {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 20px 24px;
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.field.full {
				grid-column: 1 / -1;
			}
			.field label {
				font-size: 12.5px;
				color: var(--muted);
			}
			.field input[type="text"],
			.field input[type="email"],
			.field input[type="date"],
			.field input[type="number"],
			.field select,
			.field textarea {
				background: transparent;
				border: none;
				border-bottom: 1px solid var(--line);
				color: var(--text);
				font-size: 14.5px;
				font-family: var(--font-body);
				padding: 8px 2px;
				outline: none;
				transition: border-color 0.15s ease;
			}
			.field select {
				background: transparent;
			}
			.field select option {
				background: var(--panel-2);
				color: var(--text);
			}
			.field textarea {
				resize: vertical;
				min-height: 44px;
			}
			.field input:focus,
			.field select:focus,
			.field textarea:focus {
				border-bottom: 1px solid var(--gold-soft);
			}

			.qual-row {
				display: flex;
				gap: 8px;
				align-items: center;
				margin-bottom: 8px;
			}
			.qual-row input {
				flex: 1;
			}
			.qual-remove {
				width: 26px;
				height: 26px;
				flex: 0 0 auto;
				background: transparent;
				border: 1px solid var(--line);
				color: var(--muted-2);
				cursor: pointer;
				border-radius: 3px;
				font-size: 15px;
				line-height: 1;
			}
			.qual-remove:hover {
				border-color: var(--rust);
				color: var(--rust);
			}
			.qual-add {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				background: transparent;
				border: 1px dashed var(--line);
				color: var(--muted);
				font-size: 12.5px;
				padding: 7px 12px;
				border-radius: 3px;
				cursor: pointer;
				margin-top: 2px;
			}
			.qual-add:hover {
				border-color: var(--gold);
				color: var(--gold-soft);
			}
			.qual-add .plus {
				font-size: 14px;
			}

			.sheet-actions {
				margin-top: 22px;
				display: flex;
				gap: 12px;
				align-items: center;
			}
			.btn {
				background: var(--gold);
				color: #1a1305;
				border: none;
				font-size: 14px;
				font-weight: 600;
				letter-spacing: 0.2px;
				padding: 11px 22px;
				cursor: pointer;
				border-radius: 3px;
				transition:
					background 0.15s ease,
					transform 0.1s ease;
			}
			.btn:hover {
				background: var(--gold-soft);
			}
			.btn:active {
				transform: scale(0.98);
			}
			.btn.ghost {
				background: transparent;
				border: 1px solid var(--line);
				color: var(--muted);
			}
			.btn.ghost:hover {
				border-color: var(--muted);
				color: var(--text);
			}
			.form-msg {
				font-size: 12.5px;
				color: var(--rust);
				min-height: 14px;
			}
			/* LEDGER TABLES STYLES */
			.ledger-wrap {
				background: var(--panel);
				border: 1px solid var(--line);
				overflow-x: auto;
			}
			table.ledger {
				width: 100%;
				border-collapse: collapse;
				font-size: 13.5px;
				min-width: 560px;
			}
			table.ledger thead th {
				text-align: left;
				font-weight: 600;
				font-size: 12px;
				color: var(--muted);
				padding: 14px 16px;
				border-bottom: 2px solid var(--line);
				white-space: nowrap;
				position: sticky;
				top: 0;
				background: var(--panel);
			}
			table.ledger tbody td {
				padding: 12px 16px;
				border-bottom: 1px solid var(--line-soft);
				color: var(--text);
				vertical-align: top;
			}
			table.ledger tbody tr:nth-child(odd) {
				background: rgba(201, 162, 75, 0.02);
			}
			table.ledger tbody tr:hover {
				background: rgba(201, 162, 75, 0.05);
			}
			table.ledger td.num,
			table.ledger th.num {
				font-family: var(--font-mono);
				text-align: right;
				white-space: nowrap;
			}
			table.ledger td.name-col {
				position: sticky;
				left: 0;
				background: var(--panel);
				font-weight: 600;
			}
			table.ledger tbody tr:nth-child(odd) td.name-col {
				background: #12181e;
			}
			table.ledger tfoot td {
				padding: 14px 16px;
				border-top: 2px solid var(--line);
				font-weight: 600;
				font-family: var(--font-mono);
			}
			.qual-tag {
				display: inline-block;
				font-size: 11.5px;
				color: var(--muted);
				background: var(--panel-2);
				border: 1px solid var(--line);
				padding: 2px 7px;
				border-radius: 2px;
				margin: 2px 4px 2px 0;
			}
			.row-del {
				background: transparent;
				border: none;
				color: var(--muted-2);
				cursor: pointer;
				font-size: 15px;
				padding: 2px 6px;
			}
			.row-del:hover {
				color: var(--rust);
			}
			.mark {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 24px;
				height: 24px;
				border-radius: 3px;
				font-size: 11px;
				font-weight: 700;
				font-family: var(--font-mono);
			}
			.mark.present {
				background: rgba(63, 167, 150, 0.16);
				color: var(--teal);
			}
			.mark.absent {
				background: rgba(217, 99, 74, 0.14);
				color: var(--rust);
			}
			.mark.none {
				color: var(--muted-2);
			}

			.empty-row {
				text-align: center;
				color: var(--muted-2);
				font-style: italic;
				padding: 34px 16px !important;
			}

			/* ATTENDANCE CONTROL */
			.att-controls {
				display: flex;
				align-items: flex-end;
				gap: 20px;
				flex-wrap: wrap;
				margin-bottom: 18px;
			}
			.att-list {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
				gap: 10px;
				margin: 18px 0 20px;
			}
			.att-item {
				display: flex;
				align-items: center;
				gap: 10px;
				background: var(--panel-2);
				border: 1px solid var(--line);
				padding: 10px 12px;
				border-radius: 3px;
			}
			.att-item input {
				width: 16px;
				height: 16px;
				accent-color: var(--teal);
			}
			.att-item .who {
				font-size: 13.5px;
			}
			.att-item .who small {
				display: block;
				color: var(--muted-2);
				font-size: 11px;
			}

			.section-title {
				font-size: 13px;
				color: var(--muted);
				margin: 0 0 12px;
				font-weight: 600;
			}

			footer.hint {
				text-align: center;
				color: var(--muted-2);
				font-size: 12px;
				margin-top: 60px;
			}

			@media (max-width: 880px) {
				.field-grid {
					grid-template-columns: 1fr;
				}
				.stat-row,
				.nav-grid {
					grid-template-columns: repeat(2, 1fr);
				}
				.topbar {
					flex-wrap: wrap;
				}
				.navlinks {
					order: 3;
					width: 100%;
					justify-content: space-between;
				}
			}
			@media (max-width: 520px) {
				.stat-row,
				.nav-grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body></body>
</html>
